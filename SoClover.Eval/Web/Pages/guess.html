<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Séance D — devineur</title>
<style>
  :root { --bg:#14161a; --fg:#e8e6e3; --muted:#8b9098; --line:#2a2e35; --target:#f0b429; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  header { display:flex; gap:1.5rem; align-items:baseline; padding:.9rem 1.2rem;
           border-bottom:1px solid var(--line); }
  header .grow { flex:1; }
  main { max-width:900px; margin:0 auto; padding:1.2rem; }
  .clue { margin:1.4rem 0 .4rem; font-size:1.1rem; }
  .clue b { color:var(--target); font-size:1.6rem; }
  .words { display:grid; grid-template-columns:repeat(4, 1fr); gap:.6rem; margin:1.2rem 0; }
  .word { border:1px solid var(--line); border-radius:8px; padding:.85rem .5rem; text-align:center;
          cursor:pointer; font-size:1.05rem; user-select:none; }
  .word:hover { border-color:var(--target); }
  .word.picked { border-color:var(--target); background:#2a2410; color:var(--target); font-weight:700; }
  .row { display:flex; gap:.6rem; align-items:center; margin:1rem 0; }
  button { background:#232830; color:var(--fg); border:1px solid var(--line); border-radius:6px;
           padding:.55rem 1rem; font:inherit; cursor:pointer; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .muted { color:var(--muted); }
  .err { color:#ff8f7a; min-height:1.4rem; }
  .panel { border:1px solid var(--line); border-radius:8px; padding:1rem; margin-top:1rem; }
</style>
</head>
<body>
<header>
  <div id="progress" class="muted">…</div>
  <div class="grow"></div>
  <div class="muted">clic sur deux mots · Entrée pour valider</div>
</header>
<main id="app"></main>

<script>
let view = null, shownAt = 0, picked = [];

const el = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

// transport:start
// Tout ce que la page sait du monde extérieur tient entre ces deux marqueurs. GuessKitPage y
// substitue un transport hors ligne pour produire le kit de la séance E : ce qui est EN DEHORS
// des marqueurs — CSS, render(), toggle(), la touche Entrée — reste identique octet pour octet,
// et GuessKitPageTests le vérifie. C'est la seule garantie que H2 voit ce que H1 a vu.
async function api(path, options) {
  const response = await fetch(path, options);
  let body = null;
  try { body = await response.json(); } catch { body = null; }
  return { status: response.status, body };
}

const post = (path, payload) => api(path, {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify(payload),
});
// transport:end

function render() {
  if (view.finished) {
    el("progress").textContent = `${view.completedCount} / ${view.totalCount}`;
    el("app").innerHTML =
      '<div class="panel">Séance terminée. Toutes les directions ont été devinées.</div>';
    return;
  }

  el("progress").textContent = `${view.completedCount} / ${view.totalCount}`;
  el("app").innerHTML = `
    <div class="clue">L'indice est : <b>${esc(view.clue)}</b></div>
    <div class="muted">Quels sont les deux mots visés ?</div>
    <div class="words" id="words">
      ${view.presentedWords.map((w, i) =>
        `<div class="word" data-i="${i}">${esc(w)}</div>`).join("")}
    </div>
    <div class="row">
      <button id="submit" disabled>Valider</button>
      <span id="chosen" class="muted"></span>
    </div>
    <div class="err" id="err"></div>`;

  for (const node of document.querySelectorAll(".word")) {
    node.addEventListener("click", () => toggle(view.presentedWords[Number(node.dataset.i)]));
  }
  el("submit").addEventListener("click", submit);
  shownAt = Date.now();
}

function toggle(word) {
  const at = picked.indexOf(word);
  if (at >= 0) picked.splice(at, 1);
  else if (picked.length < 2) picked.push(word);

  for (const node of document.querySelectorAll(".word")) {
    const w = view.presentedWords[Number(node.dataset.i)];
    node.classList.toggle("picked", picked.includes(w));
  }
  el("chosen").textContent = picked.join(" + ");
  el("submit").disabled = picked.length !== 2;
}

async function submit() {
  if (picked.length !== 2) return;
  el("submit").disabled = true;

  const response = await post("/api/guess", { picked, elapsedMs: Date.now() - shownAt });
  if (response.status !== 200) {
    el("err").textContent = (response.body && response.body.message) || "Erreur inattendue.";
    el("submit").disabled = false;
    return;
  }
  picked = [];
  await load();
}

async function load() {
  const response = await api("/api/next");
  view = response.body;
  picked = [];
  render();
}

document.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && picked.length === 2) submit();
});

load();
</script>
</body>
</html>
