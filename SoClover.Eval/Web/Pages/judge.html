<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Séance B — jugement par paires</title>
<style>
  :root { --bg:#14161a; --fg:#e8e6e3; --muted:#8b9098; --line:#2a2e35; --target:#f0b429; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  header { display:flex; gap:1.5rem; align-items:baseline; padding:.9rem 1.2rem;
           border-bottom:1px solid var(--line); }
  header .grow { flex:1; }
  main { max-width:900px; margin:0 auto; padding:1.2rem; }
  .board { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; margin:1rem 0; }
  .card { border:1px solid var(--line); border-radius:8px; padding:.5rem .7rem; }
  .card .pos { color:var(--muted); font-size:.72rem; text-transform:uppercase;
               letter-spacing:.08em; margin-bottom:.35rem; }
  .face { display:flex; gap:.5rem; padding:.15rem 0; }
  .face .lbl { color:var(--muted); width:4.2rem; flex:none; font-size:.82rem; }
  .face.target { color:var(--target); font-weight:700; }
  .question { margin:1.2rem 0 .6rem; }
  .pair { color:var(--target); font-weight:700; }
  .options { display:grid; grid-template-columns:1fr 1fr; gap:.8rem; }
  .option { border:1px solid var(--line); border-radius:8px; padding:1rem; text-align:center;
            cursor:pointer; font-size:1.35rem; font-weight:600; }
  .option:hover { border-color:var(--target); }
  .option .k { display:block; color:var(--muted); font-size:.75rem; font-weight:400; }
  .row { display:flex; gap:.6rem; margin:.8rem 0; }
  button { background:#232830; color:var(--fg); border:1px solid var(--line); border-radius:6px;
           padding:.55rem 1rem; font:inherit; cursor:pointer; }
  .panel { border:1px solid var(--line); border-radius:8px; padding:1rem; margin-top:1rem; }
  .muted { color:var(--muted); }
</style>
</head>
<body>
<header>
  <div id="progress" class="muted">…</div>
  <div class="grow"></div>
  <div class="muted">← position 1 · = égalité · → position 2</div>
</header>
<main id="app"></main>

<script>
const POSITIONS = ["haut-gauche", "haut-droite", "bas-droite", "bas-gauche"];
const FACES = ["Haut", "Droite", "Bas", "Gauche"];
const DISPLAY_ORDER = [0, 1, 3, 2];

let view = null, shownAt = 0;

const el = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

async function api(path, options) {
  const response = await fetch(path, options);
  let body = null;
  try { body = await response.json(); } catch { body = null; }
  return { status: response.status, body };
}

const post = (path, payload) => api(path, {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify(payload),
});

function boardHtml() {
  const targets = new Set(view.targetCells.map((c) => c[0] + ":" + c[1]));
  return DISPLAY_ORDER.map((ci) =>
    '<div class="card"><div class="pos">' + POSITIONS[ci] + "</div>" +
    view.cards[ci].map((word, fi) =>
      '<div class="face' + (targets.has(ci + ":" + fi) ? " target" : "") + '">' +
      '<span class="lbl">' + FACES[fi] + "</span>" + esc(word) + "</div>").join("") +
    "</div>").join("");
}

function renderItem() {
  el("progress").textContent = "comparaison " + view.itemOrdinal + " / " + view.totalCount;

  // La question est celle du PRD, littéralement, identique à chaque item : elle ancre sur la
  // devinabilité par un tiers, pas sur l'élégance.
  el("app").innerHTML =
    '<div class="board">' + boardHtml() + "</div>" +
    '<div class="question">Pour un joueur qui ne connaît que les 16 mots, lequel de ces deux ' +
    'indices mène le plus directement à <span class="pair">' +
    esc(view.referenceWords.join("</span> + <span class=\"pair\">")) + "</span> ?</div>" +
    '<div class="options">' +
    '<div class="option" id="opt1">' + esc(view.position1Clue) + '<span class="k">← position 1</span></div>' +
    '<div class="option" id="opt2">' + esc(view.position2Clue) + '<span class="k">position 2 →</span></div>' +
    "</div>" +
    '<div class="row"><button id="b-tie">= égalité</button>' +
    (view.canReJudge ? '<button id="b-rejudge">re-juger le précédent</button>' : "") +
    "</div>";

  el("opt1").onclick = () => verdict("1");
  el("opt2").onclick = () => verdict("2");
  el("b-tie").onclick = () => verdict("tie");
  if (view.canReJudge) el("b-rejudge").onclick = renderReJudge;

  shownAt = Date.now();
}

async function verdict(positionChoice) {
  await post("/api/verdict", { positionChoice, elapsedMs: Date.now() - shownAt });
  await refresh();
}

function renderReJudge() {
  el("app").innerHTML =
    '<div class="panel"><h3 style="margin-top:0">Re-juger le couple précédent</h3>' +
    '<p class="muted">Une nouvelle ligne est ajoutée ; rien n\'est réécrit.</p>' +
    '<div class="row"><button id="r1">position 1</button>' +
    '<button id="rt">égalité</button><button id="r2">position 2</button>' +
    '<button id="rc">annuler</button></div></div>';

  const send = async (choice) => {
    await post("/api/rejudge", { positionChoice: choice, elapsedMs: Date.now() - shownAt });
    await refresh();
  };
  el("r1").onclick = () => send("1");
  el("rt").onclick = () => send("tie");
  el("r2").onclick = () => send("2");
  el("rc").onclick = refresh;
}

function renderPause() {
  el("progress").textContent = view.completedCount + " / " + view.totalCount;
  el("app").innerHTML =
    '<div class="panel"><h3 style="margin-top:0">Pause obligatoire</h3>' +
    '<p class="pair">' + view.pauseSecondsRemaining + " s restantes</p></div>";
  setTimeout(refresh, 5000);
}

function renderFinished() {
  el("progress").textContent = view.completedCount + " / " + view.totalCount;
  el("app").innerHTML =
    '<div class="panel"><h3 style="margin-top:0">Séance B terminée</h3>' +
    "<p>Lancer <code>human-report</code> et vérifier le taux de victoire de la position 1 " +
    "ainsi que les ancres avant d'en tirer quoi que ce soit.</p></div>";
}

document.addEventListener("keydown", (event) => {
  if (!view || view.finished || view.pauseRequired || !view.position1Clue) return;
  if (event.key === "ArrowLeft") verdict("1");
  else if (event.key === "ArrowRight") verdict("2");
  else if (event.key === "=" || event.key === "Enter") verdict("tie");
});

async function refresh() {
  const { body } = await api("/api/next");
  view = body;
  if (view.finished) return renderFinished();
  if (view.pauseRequired) return renderPause();
  renderItem();
}

refresh();
</script>
</body>
</html>
