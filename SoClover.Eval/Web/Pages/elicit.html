<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Séance A — élicitation</title>
<style>
  :root { --bg:#14161a; --fg:#e8e6e3; --muted:#8b9098; --line:#2a2e35;
          --target:#f0b429; --ok:#3ea76a; --warn:#d9534f; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  header { display:flex; gap:1.5rem; align-items:baseline; padding:.9rem 1.2rem;
           border-bottom:1px solid var(--line); }
  header .grow { flex:1; }
  #chrono { font-variant-numeric:tabular-nums; font-size:1.6rem; font-weight:600; }
  #chrono.over { color:var(--warn); }
  main { max-width:900px; margin:0 auto; padding:1.2rem; }
  .board { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; margin:1rem 0 1.4rem; }
  .card { border:1px solid var(--line); border-radius:8px; padding:.5rem .7rem; }
  .card .pos { color:var(--muted); font-size:.72rem; text-transform:uppercase;
               letter-spacing:.08em; margin-bottom:.35rem; }
  .face { display:flex; gap:.5rem; padding:.15rem 0; }
  .face .lbl { color:var(--muted); width:4.2rem; flex:none; font-size:.82rem; }
  .face.target { color:var(--target); font-weight:700; }
  .pair { font-size:1.25rem; font-weight:700; color:var(--target); }
  input, select, textarea { background:#1c1f25; color:var(--fg); border:1px solid var(--line);
                            border-radius:6px; padding:.5rem .6rem; font:inherit; width:100%; }
  .row { display:flex; gap:.6rem; margin:.6rem 0; }
  button { background:#232830; color:var(--fg); border:1px solid var(--line); border-radius:6px;
           padding:.55rem 1rem; font:inherit; cursor:pointer; }
  button.solide { border-color:var(--ok); }
  button.pass { border-color:var(--warn); }
  .msg { color:var(--warn); min-height:1.4rem; }
  .panel { border:1px solid var(--line); border-radius:8px; padding:1rem; margin-top:1rem; }
  .muted { color:var(--muted); }
  ul { margin:.3rem 0 .6rem 1.1rem; padding:0; }
</style>
</head>
<body>
<header>
  <div id="progress" class="muted">…</div>
  <div class="grow"></div>
  <div id="chrono">0:00</div>
</header>
<main id="app"></main>

<script>
const RELATIONS = [
  ["", "— type de relation —"],
  ["R1_categorie", "R1 · catégorie commune"],
  ["R2_tout_partie", "R2 · tout / partie"],
  ["R3_fonction_usage", "R3 · fonction / usage"],
  ["R4_lieu_contexte", "R4 · lieu / contexte partagé"],
  ["R5_cause_consequence", "R5 · cause / conséquence"],
  ["R6_propriete_commune", "R6 · propriété commune"],
  ["R7_opposition", "R7 · opposition / contraste"],
  ["R8_sequence_temporalite", "R8 · séquence / temporalité"],
  ["R9_cooccurrence_culturelle", "R9 · co-occurrence culturelle"],
  ["R10_exemplaire_prototypique", "R10 · exemplaire prototypique"],
  ["R11_polysemie", "R11 · polysémie / double sens"],
  ["R12_specialisation_croisee", "R12 · spécialisation croisée"],
  ["R13_expression_figee", "R13 · expression figée (étape 4)"],
  ["autre", "autre"],
];
const POSITIONS = ["haut-gauche", "haut-droite", "bas-droite", "bas-gauche"];
const FACES = ["Haut", "Droite", "Bas", "Gauche"];
const DISPLAY_ORDER = [0, 1, 3, 2]; // haut-gauche, haut-droite, bas-gauche, bas-droite

let view = null, startedAt = 0, timerId = null;

const el = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

async function api(path, options) {
  const response = await fetch(path, options);
  let body = null;
  try { body = await response.json(); } catch { body = null; }
  return { status: response.status, body };
}

const post = (path, payload) => api(path, {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify(payload),
});

function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }

function startTimer() {
  stopTimer();
  startedAt = Date.now();
  const tick = () => {
    const seconds = Math.floor((Date.now() - startedAt) / 1000);
    const node = el("chrono");
    node.textContent = Math.floor(seconds / 60) + ":" + String(seconds % 60).padStart(2, "0");
    // Le chrono vire au rouge et CONTINUE de compter : bloquer la soumission à 90 s
    // forcerait un pass artificiel et fausserait la distribution des issues.
    node.classList.toggle("over", seconds >= view.timerSeconds);
  };
  tick();
  timerId = setInterval(tick, 250);
}

function boardHtml() {
  const targets = new Set(view.targetCells.map((c) => c[0] + ":" + c[1]));
  return DISPLAY_ORDER.map((ci) =>
    '<div class="card"><div class="pos">' + POSITIONS[ci] + "</div>" +
    view.cards[ci].map((word, fi) =>
      '<div class="face' + (targets.has(ci + ":" + fi) ? " target" : "") + '">' +
      '<span class="lbl">' + FACES[fi] + "</span>" + esc(word) + "</div>").join("") +
    "</div>").join("");
}

function renderItem() {
  el("progress").textContent =
    "item " + view.itemOrdinal + " / " + view.totalCount + " · " + view.boardId + " · " + view.direction;

  el("app").innerHTML =
    '<div class="board">' + boardHtml() + "</div>" +
    '<div>paire cible : <span class="pair">' + esc(view.referenceWords.join("  +  ")) + "</span></div>" +
    '<div class="row"><input id="clue" placeholder="votre indice (14 caractères max)" autocomplete="off"></div>' +
    '<div class="row"><select id="relation">' +
    RELATIONS.map(([v, label]) => '<option value="' + v + '">' + esc(label) + "</option>").join("") +
    "</select></div>" +
    '<div class="row">' +
    '<button class="solide" id="b-solide">solide</button>' +
    '<button id="b-tiede">tiède</button>' +
    '<button class="pass" id="b-pass">pass</button>' +
    "</div>" +
    '<div class="msg" id="msg"></div>';

  el("b-solide").onclick = () => submit("solide");
  el("b-tiede").onclick = () => submit("tiede");
  el("b-pass").onclick = () => submit("pass");
  el("clue").focus();
  startTimer();
}

async function submit(outcome) {
  const elapsedSeconds = Math.round((Date.now() - startedAt) / 1000);
  const { status, body } = await post("/api/attempt", {
    clue: el("clue").value,
    outcome,
    relationType: el("relation").value || null,
    elapsedSeconds,
  });

  if (status === 422) {
    // Le chrono continue : l'indice refusé est consigné dans rejectedAttempts.
    el("msg").textContent =
      "refusé (" + (body.rejectionRules || []).join(", ") + ") — reformulez, le chrono tourne";
    el("clue").select();
    return;
  }
  if (status === 400) { el("msg").textContent = body.message; return; }

  stopTimer();
  await reveal();
}

async function reveal() {
  const { body } = await api("/api/candidates");
  const candidates = (body && body.candidates) || [];

  el("app").innerHTML =
    '<div class="panel"><h3 style="margin-top:0">Ce que le modèle a produit</h3>' +
    "<p>indice retenu : <b>" + esc(body && body.clue ? body.clue : "—") + "</b></p>" +
    (candidates.length ? "<ul>" + candidates.map((c) => "<li>" + esc(c) + "</li>").join("") + "</ul>" : "") +
    '<p class="muted">' + esc((body && body.explanation) || "") + "</p></div>" +
    '<div class="panel"><h3 style="margin-top:0">Un meilleur indice émerge-t-il ?</h3>' +
    '<p class="muted">Facultatif. Consigné à part et <b>exclu du plafond humain</b>.</p>' +
    '<div class="row"><input id="assisted" placeholder="indice assisté (laisser vide si non)"></div>' +
    '<div class="row"><textarea id="notes" rows="2" placeholder="notes"></textarea></div>' +
    '<div class="row"><button id="b-next">continuer</button></div></div>';

  el("b-next").onclick = async () => {
    await post("/api/assisted", { assistedClue: el("assisted").value, notes: el("notes").value });
    await refresh();
  };
  el("assisted").focus();
}

function renderPause() {
  el("progress").textContent = view.completedCount + " / " + view.totalCount;
  el("chrono").textContent = "—";
  el("app").innerHTML =
    '<div class="panel"><h3 style="margin-top:0">Pause obligatoire</h3>' +
    "<p>Hygiène de séance : au-delà de 25 items d'affilée, la fatigue dégrade les verdicts " +
    "et l'effet devient indissociable de la difficulté des paires.</p>" +
    '<p class="pair">' + view.pauseSecondsRemaining + " s restantes</p></div>";
  setTimeout(refresh, 5000);
}

function renderFinished() {
  stopTimer();
  el("progress").textContent = view.completedCount + " / " + view.totalCount;
  el("chrono").textContent = "—";
  el("app").innerHTML =
    '<div class="panel"><h3 style="margin-top:0">Séance A terminée</h3>' +
    "<p>Le fichier d'élicitation est complet. La séance B ne pourra démarrer qu'après 24 h — " +
    "le même jour, on reconnaît ses propres indices.</p></div>";
}

async function refresh() {
  const { body } = await api("/api/next");
  view = body;
  if (view.finished) return renderFinished();
  if (view.pauseRequired) return renderPause();
  if (view.awaitingReveal) { startedAt = Date.now(); return reveal(); }
  renderItem();
}

refresh();
</script>
</body>
</html>
